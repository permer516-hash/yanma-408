services:
  postgres:
    image: postgres:17-alpine
    container_name: yanma408-postgres
    environment:
      POSTGRES_DB: yanma408
      POSTGRES_USER: yanma408
      POSTGRES_PASSWORD: yanma408
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanma408 -d yanma408"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yanma408-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: yanma408-minio
    environment:
      MINIO_ROOT_USER: yanma408_minio
      MINIO_ROOT_PASSWORD: yanma408_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:
