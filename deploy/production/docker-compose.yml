services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../apps/server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 18082
      JAVA_OPTS: -XX:MaxRAMPercentage=55.0 -XX:InitialRAMPercentage=25.0 -Djava.security.egd=file:/dev/./urandom
      YANMA408_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      YANMA408_DB_USERNAME: ${POSTGRES_USER}
      YANMA408_DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN},http://${APP_DOMAIN}
      YANMA408_OBJECT_STORAGE_ENDPOINT: ${YANMA408_OBJECT_STORAGE_ENDPOINT}
      YANMA408_OBJECT_STORAGE_ACCESS_KEY: ${YANMA408_OBJECT_STORAGE_ACCESS_KEY}
      YANMA408_OBJECT_STORAGE_SECRET_KEY: ${YANMA408_OBJECT_STORAGE_SECRET_KEY}
      YANMA408_OBJECT_STORAGE_BUCKET: ${YANMA408_OBJECT_STORAGE_BUCKET}
      YANMA408_OBJECT_STORAGE_PUBLIC_ENDPOINT: ${YANMA408_OBJECT_STORAGE_PUBLIC_ENDPOINT}
      YANMA408_OBJECT_STORAGE_VIRTUAL_STYLE: ${YANMA408_OBJECT_STORAGE_VIRTUAL_STYLE:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:18082/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_OPTIONS: --max-old-space-size=512

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
